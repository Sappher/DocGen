name: 'DocGen'
description: 'Analyze a repository with Codex using reusable prompts and open a PR with generated docs'
author: 'sappher'
branding:
  icon: 'book'
  color: 'blue'
inputs:
  prompts-folder:
    description: 'Folder containing .md prompt files'
    required: false
    default: 'prompts'
  output-folder:
    description: 'Folder where generated outputs will be written'
    required: false
    default: 'generated-docs'
  codex-executable:
    description: 'Codex CLI executable or absolute path'
    required: false
    default: 'codex'
  codex-api-key:
    description: 'Optional API key used to run codex login --with-api-key before generation'
    required: false
  openai-api-key:
    description: 'Deprecated alias for codex-api-key'
    required: false
  codex-model:
    description: 'Optional Codex model override passed to codex exec --model'
    required: false
  codex-profile:
    description: 'Optional Codex profile passed to codex exec --profile'
    required: false
  codex-sandbox:
    description: 'Sandbox mode passed to codex exec --sandbox'
    required: false
    default: 'read-only'
  codex-config:
    description: 'Optional newline separated codex exec --config overrides'
    required: false
  github-token:
    description: 'GitHub token with repo scope (e.g., secrets.GITHUB_TOKEN)'
    required: false
  branch-name:
    description: 'Branch to create/update for generated docs'
    required: false
  base-branch:
    description: 'Base branch for the pull request'
    required: false
  pr-title:
    description: 'Pull request title'
    required: false
  pr-body:
    description: 'Pull request body template'
    required: false
  dry-run:
    description: 'If true, skip git pushes and PR creation'
    required: false
    default: 'false'
  enable-git:
    description: 'Enable writing files and opening PRs in the repository'
    required: false
    default: 'false'
  enable-confluence:
    description: 'Enable publishing generated outputs to Confluence'
    required: false
    default: 'false'
  confluence-base-url:
    description: 'Base URL of the Confluence site (e.g., https://example.atlassian.net/wiki/)'
    required: false
  confluence-email:
    description: 'Confluence account email used with the API token'
    required: false
  confluence-api-token:
    description: 'Confluence API token (PAT) for authentication'
    required: false
  confluence-space-key:
    description: 'Optional Confluence space key when updating pages'
    required: false
  confluence-page-map:
    description: 'Mapping from prompt files to Confluence page IDs (JSON or newline key=value pairs)'
    required: false
  system-prompt-file:
    description: 'Optional path to a Markdown/text file whose contents are prepended to each Codex task'
    required: false
runs:
  using: 'node20'
  main: 'dist/index.js'
